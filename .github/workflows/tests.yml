name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Node.js 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
